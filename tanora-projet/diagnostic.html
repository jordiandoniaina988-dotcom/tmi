<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic connexion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 14px}input,button{display:block;width:100%;padding:10px;margin:6px 0;font-size:15px;box-sizing:border-box}button{background:#2f9e44;color:#fff;border:0;border-radius:6px}li{margin:6px 0;list-style:none}.ok{color:#2f9e44}.ko{color:#e03131}</style></head><body>
<h2>Diagnostic de connexion</h2><p>Entrez les mêmes identifiants que dans l'application.</p>
<input id="u" placeholder="Nom d'utilisateur ou email"><input id="p" type="password" placeholder="Mot de passe"><button onclick="run()">Lancer le test</button><ul id="o"></ul>
<script>
const CFG={url:'https://nomxydcjqmpzpdidhmvf.supabase.co',key:'sb_publishable__aUwHK4irWf1KRdIqDBVUw_nLMEDkw0'};
const log=(ok,m)=>document.getElementById('o').insertAdjacentHTML('beforeend',`<li class="${ok?'ok':'ko'}">${ok?'✔':'✘'} ${m}</li>`);
async function run(){document.getElementById('o').innerHTML='';
 const raw=u.value.trim().toLowerCase(),email=raw.includes('@')?raw:raw+'@tanora.app',pw=p.value;
 log(true,'Email utilisé : <b>'+email+'</b>');
 if(!window.supabase)return log(false,'Bibliothèque Supabase non chargée (pas d\'Internet ?)');
 const sb=supabase.createClient(CFG.url,CFG.key);
 try{const r=await fetch(CFG.url+'/auth/v1/settings',{headers:{apikey:CFG.key}});log(r.ok,'Projet Supabase joignable (HTTP '+r.status+')'+(r.ok?'':' — URL ou clé incorrecte, ou projet en pause'))}catch(e){return log(false,'Impossible de joindre Supabase : '+e.message)}
 const {error}=await sb.auth.signInWithPassword({email,password:pw});
 if(error)return log(false,'Connexion refusée : '+error.message+(error.message.includes('Invalid login')?' → email ou mot de passe différent de celui créé dans Authentication > Users':'')+(error.message.includes('not confirmed')?' → cochez Auto Confirm User':''));
 log(true,'Authentification réussie');
 const {data,error:e2}=await sb.from('admins').select('username');
 if(e2)return log(false,'Table admins inaccessible : '+e2.message+' → exécutez schema.sql');
 log(data.length>0,data.length?'Compte administrateur reconnu : '+data[0].username:'Compte NON administrateur → exécutez le INSERT INTO admins');
 await sb.auth.signOut()}
</script></body></html>
