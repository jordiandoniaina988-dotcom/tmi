const LOGO=($('#sp img')||{}).src||'logo.png';
async function withLoader(msg,fn){const w=document.createElement('div');w.className='lw';w.setAttribute('role','status');w.setAttribute('aria-live','polite');w.innerHTML='<div class="lc"><div class="sp2"><img src="'+LOGO+'" alt=""></div><div class="lm"><span>'+esc(t(msg))+'</span><i></i><i></i><i></i></div></div>';document.body.appendChild(w);const t0=Date.now();try{return await fn()}finally{const r=Math.max(0,650-(Date.now()-t0));setTimeout(()=>w.remove(),r)}}
const login=()=>withLoader('Connexion en cours…',login0);
const syncUI=()=>withLoader('Synchronisation…',()=>sync(1));
async function login0(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;if(!u||!p)return toast('Renseignez le nom et le mot de passe');

  return toast(m==='timeout'?'Réseau trop lent : réessayez':m.includes('not confirmed')?'Email non confirmé : confirmez-le dans Supabase (Authentication > Users)':m.includes('invalid login')?'Identifiants incorrects':'Erreur de connexion : '+error.message)}

function renewAdm(){try{const a=JSON.parse(localStorage.getItem('adm'));if(a){a.exp=Date.now()+12*36e5;localStorage.setItem('adm',JSON.stringify(a))}}catch(e){}}
function admOK(){try{const a=JSON.parse(localStorage.getItem('adm'));return a&&a.exp>Date.now()}catch{return 0}}
const enterMember=()=>withLoader('Chargement…',async()=>{role='member';try{localStorage.setItem('mb','1')}catch(e){}render();await sync()});
 function togglePw(){const p=$('#p'),b=$('.pe'),t=p.type=='password';p.type=t?'text':'password';b.setAttribute('aria-label',t?'Masquer le mot de passe':'Afficher le mot de passe');b.innerHTML='<i data-lucide="'+(t?'eye-off':'eye')+'"></i>';ico();p.focus()}

function fl(){return S.transactions.filter(x=>x.box_id==boxId&&(!F.t||x.type==F.t)&&(!F.d||x.transaction_date==F.d)&&(!F.m||x.transaction_date.slice(5,7)==F.m)&&(!F.y||x.transaction_date.slice(0,4)==F.y)&&(!F.q||x.reason.toLowerCase().includes(F.q.toLowerCase())))}
function tbl(){const A=role=='admin',all=S.transactions.filter(x=>x.box_id==boxId).sort((a,b)=>a.transaction_date.localeCompare(b.transaction_date)||(a.created_at||'').localeCompare(b.created_at||'')),bal={};let s=0;all.forEach(x=>{s+=x.type=='income'?+x.amount:-x.amount;bal[x.id]=s});
 const l=fl().sort((a,b)=>b.transaction_date.localeCompare(a.transaction_date)),T=tt(l);
 $('#tb').innerHTML=`<p class="k sm">${l.length} mouvement(s) · <span class="in">${fmt(T.i)}</span> · <span class="out">${fmt(T.o)}</span> · net ${fmt(T.i-T.o)}</p>`+(l.length?`<div class="card"><div class="dsk"><table class="tt"><tr><th>Activité</th><th>Date</th><th>Entrée</th><th>Sortie</th><th>Solde</th>${A?'<th></th>':''}</tr>${l.map(x=>{const i=x.type=='income';return `<tr class="${isSat(x.transaction_date)?'sat':''}"><td>${mv(x)}</td><td>${sd(x)}</td><td class="in">${i?fmt(x.amount):''}</td><td class="out">${i?'':fmt(x.amount)}</td><td>${fmt(bal[x.id])}</td>${A?`<td>${act(x,A,'tx')}</td>`:''}</tr>`}).join('')}</table></div><div class="mob">${l.map(x=>fi(x,0,bal[x.id],A)).join('')}</div></div>`:'<div class="card k">Aucun mouvement ne correspond à ces critères.</div>');ico()}
function csv(){const cm=isC(S.boxes.find(x=>x.id==boxId)),l=fl(),b=bx(boxId),p=[F.m&&MOIS[+F.m-1],F.y].filter(Boolean).join(' ')||'Toutes périodes',q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const t='\uFEFF'+['TANORA MPANDRESY IAVOLOHA','Caisse;'+b,'Période;'+p,'Date;Motif;'+(cm?'Membre;':'')+'Entrée;Sortie',...l.map(x=>[fd(x.transaction_date),q(x.reason),...(cm?[q((S.members.find(m=>m.id==x.member_id)||{}).full_name||'')]:[]),x.type=='income'?x.amount:'',x.type=='expense'?x.amount:''].join(';'))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=`${b}.csv`;a.click()}

function cotSec(b,A){const F0=isF(b),ms=S.members.map(m=>cstat(b,m)),due=+b.due_amount||0,n=ms.length,exp=ms.reduce((r,c)=>r+c.due,0),col=ms.reduce((r,c)=>r+c.paid,0),rest=ms.reduce((r,c)=>r+c.rest,0),got=ms.reduce((r,c)=>r+Math.min(c.paid,c.due),0),pct=exp?Math.round(got/exp*100):0;
 return `<div class="g">${stat('Attendu',fmt(exp))}${stat('Collecté',fmt(col),'in')}${stat('Reste à collecter',fmt(rest),'out')}${stat('Ont payé',cpaid(b)+' / '+n)}</div>
 <div class="card"><div class="ch"><span class="ci"><i data-lucide="users-round"></i></span><b>Suivi des cotisations</b><span class="pill">${F0?'Montant libre':fmt(due)+' / membre'}</span></div><div class="ctr"><i style="width:${pct}%"></i></div><p class="k sm" style="margin-top:6px">${pct} % collecté</p>
 <div class="bar" style="margin-top:0"><input placeholder="Rechercher un membre" aria-label="Rechercher un membre" value="${esc(CQ.q)}" oninput="CQ.q=this.value;cot()"><select onchange="CQ.s=this.value;cot()"><option value="">Tous</option><option value="none" ${CQ.s=='none'?'selected':''}>Impayés</option><option value="part" ${CQ.s=='part'?'selected':''}>Partiels</option>${F0?`<option value="unset" ${CQ.s=='unset'?'selected':''}>À définir</option>`:''}<option value="paid" ${CQ.s=='paid'?'selected':''}>Payés</option></select>${A?'<button class="btn s" onclick="csvCot()"><i data-lucide="download"></i> CSV</button>':''}</div><div id="cs" style="margin-top:10px"></div></div>`}
function cotRows(){const b=S.boxes.find(x=>x.id==boxId),q=CQ.q.toLowerCase();return S.members.map(m=>({m,c:cstat(b,m)})).filter(r=>(!CQ.s||r.c.st==CQ.s)&&r.m.full_name.toLowerCase().includes(q)).sort((a,z)=>a.m.full_name.localeCompare(z.m.full_name))}
function cot(){const b=S.boxes.find(x=>x.id==boxId),e=$('#cs');if(!b||!isC(b)||!e)return;const A=role=='admin',F0=isF(b),l=cotRows(),pay=r=>!A?'':r.c.st=='unset'?`<button class="btn s sm2" onclick="event.stopPropagation();dueForm('${r.m.id}')">Définir le montant</button>`:`<div class="ac">${r.c.rest>0?`<button class="btn s sm2" onclick="event.stopPropagation();txForm('','${r.m.id}')">Encaisser</button>`:''}${F0?`<button class="ib sm" onclick="event.stopPropagation();dueForm('${r.m.id}')" aria-label="Modifier le montant"><i data-lucide="pencil"></i></button>`:''}</div>`;
 if(!S.members.length){e.innerHTML='<p class="k">Aucun membre enregistré. Ajoutez les membres dans l\'onglet Membres.</p>';return}
 e.innerHTML=l.length?`<div class="dsk"><table class="tt"><tr><th>Membre</th><th>À payer</th><th>Payé</th><th>Reste</th><th>Statut</th>${A?'<th></th>':''}</tr>${l.map(r=>`<tr class="cr" onclick="cotHist('${r.m.id}')"><td><div class="ta"><div class="av ${avc(r.m.full_name)}">${esc(ini(r.m.full_name))}</div>${esc(r.m.full_name)}</div></td><td>${fmt(r.c.due)}</td><td class="in">${fmt(r.c.paid)}</td><td class="${r.c.rest?'out':''}">${fmt(r.c.rest)}</td><td>${sbg(r.c.st)}</td>${A?`<td>${pay(r)}</td>`:''}</tr>`).join('')}</table></div>
 <div class="mob">${l.map(r=>`<div class="fi cr" onclick="cotHist('${r.m.id}')"><div class="av ${avc(r.m.full_name)}">${esc(ini(r.m.full_name))}</div><div class="fb"><b>${esc(r.m.full_name)}</b><div class="k">${fmt(r.c.due)} · Payé ${fmt(r.c.paid)} · Reste ${fmt(r.c.rest)}</div><div class="ctr"><i style="width:${r.c.due?Math.min(100,Math.round(r.c.paid/r.c.due*100)):0}%"></i></div></div><div style="display:grid;gap:6px;justify-items:end">${sbg(r.c.st)}${pay(r)}</div></div>`).join('')}</div>`:'<p class="k">Aucun membre ne correspond.</p>';ico()}

let PS='?';
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isStd=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol!=='file:';
const b64u=v=>{const r=atob((v+'='.repeat((4-v.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushRefresh(){let x;if(!pushOK())x=(isIOS&&!isStd)?'ios':'nosup';else if(Notification.permission==='denied')x='denied';else{try{const reg=await navigator.serviceWorker.ready;x=(await reg.pushManager.getSubscription())?'on':'off'}catch(e){x='off'}}

function pushCard(){let b='',h='';
 if(PS=='on'){b='<button class="btn g0" onclick="pushOff()"><i data-lucide="bell-off"></i> Désactiver les notifications</button>';h='Notifications activées sur cet appareil.'}
 else if(PS=='off'||PS=='?')b='<button class="btn s" onclick="pushOn()"><i data-lucide="bell"></i> Activer les notifications</button>';
 else if(PS=='denied')h="Notifications bloquées : autorisez-les dans les réglages du navigateur ou de l'appareil.";
 else if(PS=='ios')h="Sur iPhone / iPad : ajoutez d'abord l'application à l'écran d'accueil (Partager > Sur l'écran d'accueil), puis rouvrez-la.";
 else h="Les notifications ne sont pas prises en charge par ce navigateur.";
 return `<div class="card" style="display:grid;gap:10px;max-width:560px"><b>Notifications</b><span class="k">Soyez averti dès qu'un admin publie quelque chose.</span>${b}${h?`<span class="k">${h}</span>`:''}</div>`}
async function pushOn(){
 if(!navigator.onLine||!sb)return toast('Internet requis pour activer les notifications');
 try{
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){await pushRefresh();return toast('Notifications refusées')}
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
  const j=sub.toJSON(),{error}=await sb.from('push_subscriptions').insert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,lang:L});
  if(error&&error.code!='23505'){console.error(error);await sub.unsubscribe();PS='off';render();return toast(missingTbl(error)?'Table push_subscriptions absente : exécutez push.sql dans Supabase':'Erreur : '+error.message)}
  PS='on';render();toast('Notifications activées ✔')
 }catch(e){console.error(e);toast("Impossible d'activer les notifications : "+(e.message||e))}}
async function pushOff(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}PS='off';render();toast('Notifications désactivées')}
